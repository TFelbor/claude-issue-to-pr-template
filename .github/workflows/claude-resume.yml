# Picks up implementations that a usage limit, or any other transient failure, cut short.
#
# The subscription behind CLAUDE_CODE_OAUTH_TOKEN has a usage wall. When a run hits it
# the model step fails mid-task; claude-implement.yml's tail pushes what exists and
# records `<!-- claude-implement-safety-net subtype=... -->` on the draft. Nothing else
# would pick that draft up until a person noticed it.
#
# This workflow re-dispatches `claude-implement` for exactly those drafts, through
# `workflow_dispatch` (the one event a workflow token may trigger), so it depends on
# no comment-trigger behaviour. A finished resumed run marks the draft ready and leaves
# `<!-- claude-implement-finished -->`, which stops this loop.
#
# What it never does: retry `error_max_turns` (a budget; retrying repeats it), touch a
# draft without a pipeline marker, dispatch after a person has commented (they took
# over), exceed MAX_ATTEMPTS, or dispatch while the previous attempt may be running.
# .github/claude/resume.py holds those rules; tests/ pins them.
name: claude-resume

on:
  schedule:
    # Every six hours, off the hour. A tick that finds nothing still costs a checkout
    # and a billed minute (Actions bills by the minute, rounded up), so a two-hourly
    # cron is ~360 minutes a month of quiet burn for a safety net that fires a few
    # times a month. What this beats is *a person not noticing*, measured in days.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  # `gh workflow run` needs this; it is what lets a workflow token dispatch another workflow.
  actions: write
  pull-requests: write

# One tick at a time: two overlapping ticks would count the same attempt twice.
concurrency:
  group: claude-resume
  cancel-in-progress: false

jobs:
  resume:
    name: resume
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Re-dispatch unfinished implementations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_ATTEMPTS: "3"
          MIN_GAP_MINUTES: "120"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/claude/resume.py
